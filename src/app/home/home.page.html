<ion-content class="ion-padding no-scroll">
    <div class="main-container">

        <div *ngIf="!showResult" class="header-section ion-text-center">
            <h1 class="main-title">Kalkulator BMI</h1>
            <p class="sub-title">Pantau kesehatan tubuhmu dengan mudah</p>
        </div>

        <div *ngIf="!showResult" class="input-form">
            <div class="gender-selection ion-text-center">
                <ion-row class="ion-justify-content-center">
                    <ion-col size="5">
                        <div class="gender-card" [class.active]="jenisKelamin === 'laki-laki'" (click)="jenisKelamin = 'laki-laki'">
                            <img src="assets/icon/male.PNG" alt="Male" />
                            <ion-label style="font-size: 12px; white-space: nowrap;">Laki-laki</ion-label>
                        </div>
                    </ion-col>
                    <ion-col size="5">
                        <div class="gender-card" [class.active]="jenisKelamin === 'perempuan'" (click)="jenisKelamin = 'perempuan'">
                            <img src="assets/icon/female.PNG" alt="Female" />
                            <ion-label style="font-size: 12px; white-space: nowrap;">Perempuan</ion-label>
                        </div>
                    </ion-col>
                </ion-row>
            </div>

            <div class="input-group">
                <ion-item lines="full" class="custom-input">
                    <ion-label position="stacked">Tinggi (cm) *</ion-label>
                    <ion-input type="number" [(ngModel)]="tinggi" placeholder="Contoh: 170"></ion-input>
                </ion-item>
                <ion-item lines="full" class="custom-input">
                    <ion-label position="stacked">Berat (kg) *</ion-label>
                    <ion-input type="number" [(ngModel)]="berat" placeholder="Contoh: 50"></ion-input>
                </ion-item>
            </div>

            <ion-button expand="block" shape="round" class="hit-btn" (click)="hitungBMI()" [disabled]="!isValidInput()">
                HITUNG BMI
            </ion-button>
        </div>

        <div *ngIf="showResult" class="result-container">
            <div class="avatar-header ion-text-center">
                <img [src]="jenisKelamin === 'laki-laki' ? 'assets/icon/male.PNG' : 'assets/icon/female.PNG'" />
            </div>

            <ion-card class="result-card">
                <ion-card-content class="ion-text-center">
                    <p class="sub-label">BMI untuk {{jenisKelamin}}</p>
                    <h1 class="cat-label" [ngClass]="getBMIClass()">{{getKategoriBMI()}}</h1>

                    <ion-row class="summary-box">
                        <ion-col>
                            <small>Tinggi (cm)</small>
                            <p><strong>{{tinggi}}</strong></p>
                        </ion-col>
                        <ion-col>
                            <small>Berat (kg)</small>
                            <p><strong>{{berat}}</strong></p>
                        </ion-col>
                    </ion-row>

                    <div class="gauge-wrapper">
                        <div class="bar-container">
                            <div class="bar">
                                <div class="seg s-kurang"></div>
                                <div class="seg s-normal"></div>
                                <div class="seg s-kegemukan"></div>
                                <div class="seg s-obesitas"></div>
                            </div>
                            <div class="indicator" [style.left.%]="calculateGaugePosition()">
                                <div class="bubble">{{hasilBMI}}</div>
                                <div class="arrow-down"></div>
                            </div>
                        </div>
                    </div>

                    <p class="advice">{{getSaran()}}</p>

                    <div class="ion-text-right">
                        <ion-button fill="clear" color="danger" (click)="resetForm()">CEK ULANG</ion-button>
                    </div>
                </ion-card-content>
            </ion-card>
        </div>

    </div>
</ion-content>
